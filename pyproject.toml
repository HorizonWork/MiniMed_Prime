[project]
name = "minimed-rag-kg"
version = "0.1.0"
description = "Reconstructed project metadata for the existing minimed-rag-kg virtual environment."
requires-python = "==3.11.*"
dependencies = [
  "fastapi==0.136.1",
  "uvicorn==0.46.0",
  "pydantic==2.13.3",
  "pydantic-settings==2.14.0",
  "python-dotenv==1.2.2",
  "SQLAlchemy==2.0.49",
  "alembic==1.18.4",
  "asyncpg==0.31.0",
  "psycopg==3.3.3",
  "psycopg-binary==3.3.3",
  "neo4j==6.1.0",
  "opensearch-py==3.1.0",
  "pymilvus==2.6.12",
  "redis==7.4.0",
  "prefect==3.6.28",
  "pandas==3.0.2",
  "numpy==1.26.4",
  "scipy==1.17.1",
  "scikit-learn==1.8.0",
  "networkx==3.6.1",
  "torch==2.11.0",
  "transformers==5.6.2",
  "datasets==4.8.4",
  "spacy==3.7.5",
  "scispacy==0.5.5",
  "en_core_sci_lg==0.5.4",
  "rank-bm25==0.2.2",
  "boto3==1.42.95",
  "docker==7.1.0",
]

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "ruff==0.15.12",
  "mypy==1.20.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
