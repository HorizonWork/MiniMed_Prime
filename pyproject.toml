[project]
name = "biomed-kg-rag"
version = "0.1.0"
description = "Biomedical KG-RAG and TRM reasoning training scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["boto3", "fastapi", "neo4j", "numpy", "opensearch-py", "prefect", "psycopg[binary]", "pydantic", "pydantic-settings", "pymilvus", "pyyaml", "scikit-learn", "torch", "typer", "uvicorn"]

[project.scripts]
biomedkg = "biomed_kg.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biomed_kg"]
