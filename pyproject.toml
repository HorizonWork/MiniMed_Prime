[project]
name = "minimed-rag-kg"
version = "0.1.0"
description = "Biomedical KG-RAG and TRM reasoning training scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3",
    "datasets",
    "fastapi",
    "neo4j",
    # numpy<2 is required by the `kg` extra (scispacy 0.5 → spacy 3.7 → thinc 8.2
    # is built against numpy 1 ABI). Keep the constraint on the core dep so
    # `uv sync` with or without --extra kg stays consistent.
    "numpy<2.0",
    "opensearch-py",
    "prefect",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "pymilvus",
    "pyyaml",
    "scikit-learn",
    "torch",
    "transformers>=5.6.2",
    "rank-bm25",
    "typer",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]
benchmark = [
    "transformers",
    "accelerate",
]
kg = [
    "scispacy>=0.5.4",
    "spacy>=3.7,<4.0",
    "pandas>=2.0",
    "python-dotenv",
]

[project.scripts]
minimed = "minimed_rag.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minimed_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: tests requiring live Docker services (Neo4j, Postgres, etc.); gated by RUN_INTEGRATION=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = ["tests/"]
