[project]
name = "minimed-rag-kg"
version = "0.1.0"
description = "Biomedical KG-RAG and TRM reasoning training scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3",
    "datasets",
    "fastapi",
    "neo4j",
    "numpy",
    "opensearch-py",
    "prefect",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "pymilvus",
    "pyyaml",
    "scikit-learn",
    "torch",
    "transformers>=5.6.2",
    "rank-bm25",
    "typer",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]
benchmark = [
    "transformers",
    "accelerate",
]

[project.scripts]
minimed = "minimed_rag.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minimed_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = ["tests/"]
